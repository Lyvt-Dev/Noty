name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: noty-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libcurl4-openssl-dev libsecret-1-dev xvfb
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --target Noty NotyUpdate update_test codec_test ui_text_test search_test noty_example_plugin --parallel 3
      - name: Test update validation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Windows application smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $notyTest = Start-Process build/Release/Noty.exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($notyTest.ExitCode -ne 0) { throw 'Noty application smoke test failed' }
          Get-Content build/Release/smoke-test.txt
      - name: Linux application smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a build/Noty --smoke-test
      - name: Package
        working-directory: build
        run: cpack -C Release -D CPACK_PACKAGE_FILE_NAME=Noty-${{ matrix.platform }}
      - name: Rename Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/Noty-*.exe | Select-Object -First 1
          Move-Item -LiteralPath $installer.FullName -Destination build/Noty-windows-x64-setup.exe
      - name: Upgrade existing Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-upgrade.ps1
      - name: Upgrade existing macOS or Linux installation
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-upgrade-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Noty-${{ matrix.platform }}
          path: |
            build/Noty-*.exe
            build/Noty-*.zip
            build/Noty-*.dmg
            build/Noty-*.deb
            build/Noty-*.tar.gz
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/project(Noty VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version already published; bump CMake project version to publish another release."
            exit 0
          fi
          cd packages
          sha256sum * > SHA256SUMS
          cd ..
          python scripts/legacy_release_text.py RELEASE_NOTES.md release-notes-ascii.txt
          if gh release view v0.4.0 >/dev/null 2>&1; then
            legacy_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.4.0" --jq .id)
            gh api "repos/$GITHUB_REPOSITORY/releases/$legacy_id" | python scripts/legacy_release_text.py > legacy-release-patch.json
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$legacy_id" --input legacy-release-patch.json >/dev/null
          fi
          gh release create "$tag" packages/* --target "$GITHUB_SHA" --title "Noty $version (Preview)" --prerelease --notes-file release-notes-ascii.txt
